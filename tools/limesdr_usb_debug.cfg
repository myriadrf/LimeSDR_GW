# OpenOCD interface + TAP configuration for interactive RISC-V debugging of the
# LimeSDR-USB firmware over the board's on-board FT2232 JTAG cable.
#
# Use it together with the shared RISC-V tunnel target script (the same one the
# XTRX/SSDR/HiperSDR reference boards use):
#
#   openocd -f tools/limesdr_usb_debug.cfg -f riscv_jtag_tunneled.tcl
#
# This needs ONLY upstream OpenOCD with RISC-V support -- no litex_server, no
# forked OpenOCD, and no patch step. Build the matching bitstream first with:
#
#   python3 boards/targets/limesdr_usb.py --build --with-cpu-debug
#
# See tools/LimeSDR_USB_firmware_debug.md for the full workflow.

# --- Physical adapter: on-board FT2232 (same cable used for --load/--flash) ----
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi layout_init 0x0008 0x000b

# Physical FT2232 JTAG clock (kHz). 6 MHz is a conservative value that stays well
# inside the 20 MHz ceiling of the cd_jtag clock domain constrained in
# boards/targets/limesdr_usb.py::add_jtag_cpu_debug(). Lower it if scan errors
# appear; raise it (up to 20 MHz) to reduce debug latency.
adapter speed 6000

reset_config none

# --- Cyclone IV E (EP4CE40F23C8) device TAP ------------------------------------
# The RISC-V Debug Module is tunneled through the device's single Altera virtual
# JTAG instance, so OpenOCD drives the real device TAP directly (10-bit IR). The
# IDCODE 0x020F40DD is the EP4CE40 device ID (cf. the committed, device-specific
# gateware/board_specific/limesdr_usb/sfl_ep4ce40_020f40dd.svf).
#
# IMPORTANT: the TAP must NOT be named "riscv.cpu". riscv_jtag_tunneled.tcl uses
# `riscv.cpu` as its own _TARGETNAME, and only creates its own Xilinx-style
# (irlen 6, expected-id 0x10003FFF) TAP when the board's TAP_NAME equals that
# target name. Naming this TAP "riscv.cpu" would therefore make the shared
# script clobber this real irlen-10 EP4CE40 TAP with a bogus irlen-6 one --
# yielding `IR capture error; saw 0x3f not 0x01` and `dtmcontrol is 0`. Using a
# distinct chip/tap name (as the working JTAGBone config does) keeps this TAP
# and lets the script bind its RISC-V target to it via -chain-position.
set _CHIPNAME ep4ce40
jtag newtap $_CHIPNAME tap -irlen 10 -expected-id 0x020F40DD

# Bind the RISC-V target created by riscv_jtag_tunneled.tcl to the TAP declared
# above (distinct from the script's own "riscv.cpu" target name), instead of
# letting it create a Xilinx-style (irlen 6) TAP of its own.
set TAP_NAME $_CHIPNAME.tap

# --- Altera virtual-JTAG tunnel instruction ------------------------------------
# A Xilinx BSCANE2 exposes the tunnel data register under USER4; the Altera
# virtual JTAG on this Cyclone IV exposes it under the device USER1 instruction
# instead. riscv_jtag_tunneled.tcl applies this override (via
# `riscv set_bscan_tunnel_ir`) only when BSCAN_TUNNEL_IR is set, so the Xilinx
# reference boards are unaffected. 0x00E is the Cyclone IV USER1 opcode; if
# hardware bring-up reports scan / IDCODE errors, this opcode is the first thing
# to re-check against the Cyclone IV E device handbook.
set BSCAN_TUNNEL_IR 0x00e

# --- Force hardware breakpoints for the ROM-resident firmware ------------------
# The whole firmware runs from read-only ROM, so GDB's default *software*
# breakpoints (which insert an `ebreak` by writing to the code) silently do
# nothing: the write to ROM is ignored by the hardware, the breakpoint never
# fires, and both `break` and source-level `step`/`next` (which GDB implements
# with temporary breakpoints) run forever without ever stopping. The core does
# expose 4 real hardware trigger comparators, so instruct OpenOCD to translate
# every GDB breakpoint request into a hardware breakpoint. This mirrors the
# `gdb_breakpoint_override hard` the legacy debug config relied on, and needs no
# ROM memory-map trickery on the GDB side.
gdb_breakpoint_override hard
