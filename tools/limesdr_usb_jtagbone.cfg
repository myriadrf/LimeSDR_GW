# OpenOCD interface + TAP configuration for the LimeSDR-USB JTAGBone (wishbone-over-JTAG)
# bus master, used for GATEWARE debugging / register monitoring -- NOT firmware GDB debug.
#
# Build the matching bitstream first:
#
#   python3 boards/targets/limesdr_usb.py --build --with-jtagbone
#
# then bridge the SoC wishbone/CSR space to the host and drive it with the standard LiteX
# tools (see tools/LimeSDR_USB_firmware_debug.md, "Gateware debugging / register monitoring"):
#
#   litex_server --jtag --jtag-config tools/limesdr_usb_jtagbone.cfg
#   litex_cli --regs
#
# This needs only upstream OpenOCD (as bundled with LiteX) -- no forked OpenOCD, no patch.
# For interactive RISC-V firmware GDB debugging use tools/limesdr_usb_debug.cfg instead
# (the two build flags are mutually exclusive).

# --- Physical adapter: on-board FT2232 (same cable used for --load/--flash) ----
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi layout_init 0x0008 0x000b

# Physical FT2232 JTAG clock (kHz). 6 MHz stays inside the 20 MHz ceiling of the
# jtagbone cd_jtag clock domain constrained in
# boards/targets/limesdr_usb.py (add_jtagbone block). Lower it if scan errors appear.
adapter speed 6000

reset_config none

# --- Cyclone IV E (EP4CE40F23C8) device TAP ------------------------------------
# The JTAGBone wishbone bridge is reached through the device's single Altera virtual
# JTAG instance, so OpenOCD drives the real device TAP directly (10-bit IR). The IDCODE
# 0x020F40DD is the EP4CE40 device ID (cf. gateware/board_specific/limesdr_usb/
# sfl_ep4ce40_020f40dd.svf).
jtag newtap ep4ce40 tap -irlen 10 -expected-id 0x020F40DD
